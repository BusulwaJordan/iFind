name: ifind
description: "AI-ready local business connection platform for Uganda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3

  # Backend & Database
  supabase_flutter: ^2.7.0

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Forms & Validation
  formz: ^0.6.1

  # Icons
  cupertino_icons: ^1.0.6

  # AI & Machine Learning
  google_generative_ai: ^0.4.0

  # UI & Animations
  flutter_animate: ^4.5.0
  timeago: ^3.6.1

  # Media & Storage
  image_picker: ^1.0.7
  video_player: ^2.8.2
  chewie: ^1.7.4
  flutter_image_compress: ^2.1.0
  video_compress: ^3.1.2
  path_provider: ^2.1.2
  image: ^4.1.0

  # Utils
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.4
  badges: ^3.1.2
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  share_plus: ^7.2.2
  go_router: ^17.2.0

  # Data Modeling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/

